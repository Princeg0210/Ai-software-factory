name: ai-software-factory
services:
  - name: web
    git:
      repository: github.com/Princeg0210/Ai-software-factory
      branch: main
      build_command: pip install -r requirements.txt
      run_command: uvicorn main:app --host 0.0.0.0 --port 8000
    instance_type: free
    regions:
      - fra
    ports:
      - port: 8000
        path: /
        protocol: http
    env:
      - key: GEMINI_API_KEY
        value: ""
      - key: PORT
        value: "8000"
