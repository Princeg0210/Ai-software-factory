# docker-compose.yml: Local Deployment Architecture for the AI Software Factory
version: '3.8'

services:
  # Core Web Backend & API Orchestrator
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/factory
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # Celery Asynchronous FSM Task Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A tasks worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/factory
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  # Secure Local Cache and Task Queue Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # PostgreSQL Ledger and Trajectory State Database
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=factory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
